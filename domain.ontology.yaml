# SPM ONE — Domain Ontology (Canonical)
# Revised Apr 2026 from audit + product clarifications.
# Updated Apr 2026: Equipment Home Page, Workspace module stub, Tools scoping,
# Data & Jobs (`data_sync` tool) filter, Dashboard popup read-only mode.
# Updated Apr 27 2026: Full Workspace Module spec — folders, dashboard
# lifecycle (created/published), per-user ownership, shares, share links,
# comments, in-app alerts, full-screen dashboard viewer route, cross-tab
# open-state signalling.
# Updated Apr 27 2026 (rev 2): Workspace dashboards established as the
# canonical source of truth for dashboard metadata across all modules.
# Removed static dashboardCards registry; Equipment Home, Home Page Recents,
# Site/Plant Overview tab stacks derive their dashboard data from published
# WorkspaceDashboard records.
# Updated Apr 27 2026 (rev 3): What-If Scenario result 'View Data' navigates
# to Equipment Home for the run's equipment only — no dashboard popup auto-open.
# Updated Apr 28 2026: AppModule `workspace` is labeled **Dashboard** in the UI;
# code, routes, and stores keep the Workspace naming (see business_rules).
# Updated Apr 28 2026: Mock asset tree is Site → Unit → Equipment. Site 2000
# (id site-x) has three units: Unit 2006 - DCU, Unit 2007 - HCU, Unit 2008 -
# Hydrogen Unit. Primary equipment ids equipment-a/b/c (Coker 01, HCU 01, SMR
# Pigtails) are unchanged. Placeholder equipment rows have no functional surface.
# Updated Apr 29 2026: Workspace dashboard editor external widget drop uses
# react-grid-layout legacy onDrop(layout, item, e); drag payload remains JSON in
# DataTransfer (`application/x-spm-widget`), consistent with prior Equipment
# Dashboard edit mode (now superseded; see business_rules single-editor).
# Updated Apr 29 2026 (rev 2): **Single editor engine (Option A)** — interactive
# dashboard authoring (widget layout edit/save) is **only** the Dashboard module
# App Router editor. The legacy in-shell `EquipmentDashboard` / `currentView: equipment`
# editor is retired; Asset surfaces remain read-only for dashboard preview.
# Updated Apr 30 2026: **Catalog-driven dashboard library (Coker v1 + future types)** —
# `EquipmentKnowledgePack`, `ParameterFamily`, `CatalogWidgetTemplate`, `ParameterRequest`;
# `WorkspaceDashboard.widgets` shall evolve to templateId + options + displayTitle; see
# `scripts/prd.txt` (Coker catalog PRD) and PROJECT.md.
# Updated Apr 30 2026 (rev 2): Coker **raster_image** template kind — selected
# catalog tiles render from static files in `public/coker/widgets/` (code-mapped
# paths in `lib/equipment-packs/coker-widget-images.ts`).
# Updated Apr 30 2026 (rev 4): **Production workspace identity** — when built for
# production, effective workspace user id follows Auth.js session (`ORG_USERS` ids);
# client localStorage cannot override identity in prod.
# Updated Apr 30 2026 (rev 3): **Workspace DB bootstrap** — signed-in clients load
# folders, dashboards, and shares from PostgreSQL (`GET /api/workspace/bootstrap`), not
# from localStorage as source of truth. The deterministic bundle `WORKSPACE_SEED` in
# `lib/workspace/seed.ts` is promoted into the DB by `pnpm db:seed` via
# `prisma/seed-workspace.ts` after users and the Site/Unit/Equipment hierarchy from
# `lib/data.ts`. Primary catalog equipment ids remain **equipment-a** (Coker 01),
# **equipment-b** (HCU 01), **equipment-c** (SMR Pigtails); dashboard POST validates
# `equipmentId` against `Equipment`.
# Updated May 1 2026: **Module URL parity** — every primary AppModule surface (Home,
# Assets hierarchy + Equipment Home, Tools: Data & Jobs / What-If / Documents, Insights,
# Settings as they exist) SHALL be reached via stable Next.js App Router URLs with real
# browser navigation (back/forward, bookmarkable deep links), matching the pattern
# already used for the Workspace module (UI: **Dashboard** at `/dashboard/*`). This is
# a routing/navigation invariant only: **no change to visible UI layout, styling, copy, or
# interaction affordances** unless required to preserve behavior under URL-driven routing.
# Updated May 1 2026 (rev 2): **Auth-gated main shell + notification chrome** — unauthenticated
# users cannot use the main app shell (`/home`, `/assets/*`, `/tools/*`, `/insights/*` as
# implemented); they authenticate at `/login` first. Default signed-in landing remains `/home`.
# Comms in-app feed is labeled **Notifications** (implementation may keep route `/comms/alerts`).
# Header bell mirrors Comms **Notifications** (unread parity); **ephemeral new-item previews** anchor
# under the bell (compact dropdown-style cards, short TTL), not a full-width header strip and
# not global Sonner toasts for notification delivery.
# Updated May 1 2026 (rev 3): **Notification preview anchoring** — ephemeral previews for newly
# received unread notifications render in a compact stack **immediately below** the header Bell
# (same visual language as the bell dropdown, smaller), auto-dismiss after a short interval; no
# full-width banner strip under the global header and no Sonner `toast.info` channel for those events.
# Updated May 2 2026 (rev 5): **Notifications inbox hygiene** — `archivedAt` on
# `Notification` (archive / restore / delete in UI; persisted via Postgres when using the workspace API);
# **Alert Setting** create flow is a
# single configuration step (sheet) with per-parameter conditions before save; **Test** demo
# notifies assignees or the rule owner when no assignees.
# Updated May 2 2026: **Data & Jobs** tool (`Tool.key` remains `data_sync`; route `/tools/data-sync`):
# **Data Status** + **FEA Jobs**; deferred entities `ClientSensorDatabaseSource`,
# `SensorIngestHealthSnapshot`, `EquipmentAnalysisOutputDescriptor`, `DataTransferLogEntry`.
# Updated May 2 2026 (rev 2): **Data Status** UI groups **client DB sources**, **per-sensor
# channel ingest** (heterogeneous cadence: process channels vs laser campaign), and
# **product outputs**; `SensorIngestHealthSnapshot` comment distinguishes equipment roll-up
# from per-channel presentation.
# Updated May 2 2026 (rev 3): **Data & Jobs** UI uses **tabs** to separate **Data Status** from **FEA Jobs**
# on `/tools/data-sync` (see business_rules).
# Updated May 3 2026: **Settings** `AppModule` is **in-app application settings** (appearance, locale,
# workspace defaults, tools/export defaults, privacy, about) — non-persistent in sidebar rail and `/settings` until backend wiring.
# Retired from Settings nav: **General**, **Integrations**, **Alert Settings** (notification feed and
# preferences remain **Comms → Notifications**; no duplicate Alert Settings row in Settings).
# Updated May 2026: **Alert Setting** tool (`Tool.key = alert_setting`, route `/tools/alert-setting`) under
# **Tools / Insights** — equipment-scoped rules with **draft** vs **active** visibility (assignees only see **active**),
# **Edit**-gated field changes, **Test** preview notifications to owner + assignees, schedules, delete workflow,
# soft-deleted history. v1 stores rules in **browser `localStorage`** (shared for all users on the same origin /
# device — not synced across separate browsers or servers until a persistence API exists). **Create** saves as
# **active** when the rule has assignees (so they appear on assignees' Alert Setting immediately), otherwise **draft**.
# **Coker 01** (`equipment-a`) has full UX; other primaries show **coming soon** until fixtures align with Data & Jobs.
# Firings integrate with **Comms → Notifications** via `operational_alert`; deep-link to Equipment Home.
# Updated May 3 2026 (rev 2): **Tools module** primary tool pages share one **page chrome** (breadcrumb,
# title, description, optional route chip, gradient shell) in `components/tools/tool-page-layout.tsx` for
# visual consistency; URLs, behavior, and store sync rules are unchanged.

entities:
  User:
    fields:
      id: { type: uuid }
      name: { type: string }
      email: { type: string, format: email, unique: true }
      avatarUrl:
        type: string
        nullable: true
        comment: "Used for avatar chips in dashboard cards, share dialogs, alerts."
      initials:
        type: string
        nullable: true
        comment: "Short initials for chips; may be derived from name if not set."
      role:
        type: enum
        values: [integrity_engineer, process_engineer, admin, product_team]
        comment: "product_team may access ParameterRequest queue (in-app). # ASSUMPTION — verify role taxonomy with product owner."
      isCurrentUser:
        type: boolean
        default: false
        comment: "Mock-only; **deprecated** when real authentication is enabled.
          Replaced by session-bound identity. Do not rely on in production."
      passwordHash:
        type: string
        nullable: true
        comment: "Argon2/bcrypt hash for email+password auth; null if the user
          is OAuth-only. Never log or return to clients."
      emailVerified:
        type: datetime
        nullable: true
        comment: "When the email was verified; null = not verified (policy TBD)."
      lastLoginAt:
        type: datetime
        nullable: true
        comment: "Last successful sign-in (optional analytics / security)."
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  # ── Auth.js / NextAuth-style session (persisted server-side) ──────────────
  Account:
    comment: "OAuth provider link (Auth.js `Account` model). Optional if the
      product only uses email+password; present for future SSO."
    fields:
      id: { type: string, comment: "Provider row id (e.g. cuid)." }
      userId: { type: uuid, references: User.id }
      type: { type: string, comment: "e.g. oauth" }
      provider: { type: string, comment: "e.g. google" }
      providerAccountId: { type: string }
      refresh_token: { type: string, nullable: true }
      access_token: { type: string, nullable: true }
      expires_at: { type: integer, nullable: true }
      token_type: { type: string, nullable: true }
      scope: { type: string, nullable: true }
      id_token: { type: string, nullable: true }
      session_state: { type: string, nullable: true }

  Session:
    comment: "Server-side session for cookie-based login (Auth.js `Session`)."
    fields:
      id: { type: string }
      sessionToken: { type: string, unique: true }
      userId: { type: uuid, references: User.id }
      expires: { type: datetime }

  VerificationToken:
    comment: "Password reset or email verification token (Auth.js pattern)."
    fields:
      identifier: { type: string, comment: "Often email" }
      token: { type: string, unique: true }
      expires: { type: datetime }

  Site:
    fields:
      id: { type: uuid }
      name: { type: string }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  Plant:
    fields:
      id: { type: uuid }
      siteId: { type: uuid, references: Site.id }
      name: { type: string }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }
    comment: "Optional organizational layer for future multi-plant sites; the Apr
      2026 mock does not use Plant between Site and Unit."

  Unit:
    fields:
      id: { type: uuid }
      siteId: { type: uuid, references: Site.id }
      name: { type: string }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }
    comment: "Process unit (e.g. DCU, HCU, Hydrogen) — the middle tier of the
      Asset module hierarchy under Site in the mock. Encoded in lib/data.ts as
      the `units` array on each site; each element is a Unit row."

  Equipment:
    fields:
      id: { type: uuid }
      unitId: { type: uuid, references: Unit.id }
      name: { type: string }
      isPlaceholder:
        type: boolean
        default: false
        comment: "When true, the row appears in the asset menu only; click does
          not navigate. Mock-only."
      type:
        type: enum
        values: [vessel, reactor, pump, smr, other]
        comment: "# ASSUMPTION — inferred from UI naming."
      hasWhatIfTool: { type: boolean, default: false }
      equipmentTypeKey:
        type: string
        default: other
        comment: "Catalog key for the equipment knowledge pack (e.g. coker, hcu, smr).
          Drives Widget Library and `CatalogWidgetTemplate` filter. Aligned to
          approved equipment-type packs shipped by the product team only."
      parameterAddonKeys:
        type: array
        items: { type: string }
        default: []
        comment: "Optional add-on parameter family keys enabled for this asset
          (product team publishes; appears in library when non-empty)."
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  Dashboard:
    fields:
      id: { type: uuid }
      equipmentId: { type: uuid, references: Equipment.id }
      name: { type: string }
      orderIndex: { type: integer }
      sourceDashboardId:
        type: uuid
        nullable: true
        references: Dashboard.id
        comment: "Set when cloned from an existing dashboard."
      isSystemDashboard: { type: boolean, default: false }
      isFavorite:
        type: boolean
        default: false
        comment: "User-scoped favourite flag; used by Equipment Home Page Favourites section."
      lastAccessedAt:
        type: datetime
        nullable: true
        comment: "Timestamp of last user access; used by Equipment Home Page Recent section."
      lifecycleStatus:
        type: enum
        values: [created, published]
        default: created
        comment: "Workspace lifecycle: 'created' = draft visible only in owner's
          (and shared collaborators') Workspace; 'published' = also visible in
          Asset Module Equipment Home Page to users with Site/Plant/Equipment
          access."
      ownerUserId:
        type: uuid
        references: User.id
        comment: "The dashboard creator; sole owner. Sharing grants other users
          access without changing ownership."
      contributorUserIds:
        type: array
        items: { type: uuid, references: User.id }
        default: []
        comment: "Users (other than the owner) who saved at least one edit while
          holding edit permission. Derived/append-only."
      folderId:
        type: uuid
        nullable: true
        references: WorkspaceFolder.id
        comment: "Workspace folder this dashboard lives in (null = workspace root).
          Folder is owned by the same user as the dashboard."
      thumbnailUrl:
        type: string
        nullable: true
        comment: "Mock URL/path used in Workspace card grid and Recent."
      lastChangeAt:
        type: datetime
        comment: "Timestamp of last save (any contributor or owner). Drives
          Workspace 'date of change' filter and sort."
      lastChangeByUserId:
        type: uuid
        nullable: true
        references: User.id
        comment: "User who last saved a change to this dashboard."
      publishedAt:
        type: datetime
        nullable: true
        comment: "Set when lifecycleStatus transitions to 'published'."
      deletedAt:
        type: datetime
        nullable: true
        comment: "Soft-delete timestamp for Workspace Trash; null = not deleted."
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  Widget:
    fields:
      id: { type: uuid }
      key: { type: string }
      name: { type: string }
      kind:
        type: enum
        values: [kpi, chart, table, model_view, summary, generic]
      dataSourceType:
        type: enum
        values: [live_equipment, whatif_result, mixed, static_mock]
        comment: "# ASSUMPTION — intended production source modes."
      defaultConfig:
        type: json
        nullable: true
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  DashboardWidget:
    fields:
      id: { type: uuid }
      dashboardId: { type: uuid, references: Dashboard.id }
      widgetId: { type: uuid, references: Widget.id }
      x: { type: integer }
      y: { type: integer }
      w: { type: integer }
      h: { type: integer }
      minW: { type: integer, default: 2 }
      minH: { type: integer, default: 2 }
      configOverride: { type: json, nullable: true }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  WidgetLibraryItem:
    fields:
      id: { type: uuid }
      widgetId: { type: uuid, references: Widget.id }
      displayName: { type: string }
      category: { type: string }
      defaultW: { type: integer }
      defaultH: { type: integer }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }
    comment: "Legacy drag-catalog join to `Widget` — to be superseded or bridged
      by `CatalogWidgetTemplate` entries in the Coker pack migration."

  EquipmentKnowledgePack:
    comment: "Versioned release artifact: one row per (equipmentTypeKey, semver).
      Authored only by the product team; not editable in-app by customers."
    fields:
      id: { type: uuid }
      equipmentTypeKey: { type: string }
      version: { type: string, comment: "Semver or integer; stored on each dashboard save." }
      releasedAt: { type: datetime }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  ParameterFamily:
    comment: "Stable approved parameter for an equipment type; library grouping
      and data-contract anchor. Category matches UX: Asset Information, Asset
      Efficiency, Event Visualization, Other."
    fields:
      id: { type: uuid }
      packId: { type: uuid, references: EquipmentKnowledgePack.id }
      key: { type: string, comment: "Stable id, e.g. fatigue_total_damage" }
      displayName: { type: string }
      category:
        type: enum
        values:
          [asset_information, asset_efficiency, event_visualization, other]
      dataContract:
        type: json
        nullable: true
        comment: "Schema hint for API/mock binding; product-owned."
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  CatalogWidgetTemplate:
    comment: "Presentation template (PRD: WidgetTemplate): one row per approved
      visual; links to a ParameterFamily or a control family; whitelisted
      options schema; references images as acceptance baseline for QA."
    fields:
      id: { type: uuid }
      packId: { type: uuid, references: EquipmentKnowledgePack.id }
      key: { type: string, comment: "Stable template id, e.g. coker_fatigue_heatmap" }
      displayName: { type: string }
      parameterFamilyId:
        type: uuid
        nullable: true
        references: ParameterFamily.id
        comment: "Null when template is a dashboard control (e.g. time information)."
      kind:
        type: enum
        values:
          - kpi_card
          - time_series
          - gauge
          - area_chart
          - data_table
          - heatmap_2d
          - schematic_3d
          - polar_plot
          - bar_chart
          - fad_chart
          - unwrapped_map
          - control_time_range
          - multi_tab_panel
          - empty_state
          - composite_kpi_strip
          - raster_image
      followsDashboardContext: { type: boolean, default: true }
      optionSchema: { type: json, comment: "Whitelisted options; no style keys." }
      defaultW: { type: integer }
      defaultH: { type: integer }
      minW: { type: integer }
      minH: { type: integer }
      thumbnailRef: { type: string, nullable: true }
      referenceScreenId: { type: string, nullable: true, comment: "e.g. R1–R6" }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  ParameterRequest:
    comment: "In-app request for a new parameter; visible to product team only
      in v1 (role-gated or admin surface)."
    fields:
      id: { type: uuid }
      requesterUserId: { type: uuid, references: User.id }
      equipmentId: { type: uuid, references: Equipment.id, nullable: true }
      body: { type: string }
      categoryHint: { type: string, nullable: true }
      status:
        type: enum
        values: [submitted, acknowledged, closed]
        default: submitted
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  AppModule:
    fields:
      id: { type: uuid }
      key:
        type: enum
        values: [home, assets, workspace, insights, comms, settings]
        comment: "Canonical key `workspace` identifies the Workspace feature in
          code, App Router URLs (`/dashboard/*`), and stores (`useWorkspaceStore`). In the
          product UI this module is labeled **Dashboard** (module rail, folder
          tree header, deep links) to distinguish the *module* from individual
          `Dashboard` entities. The per-user dashboard CMS (folders, drafts,
          sharing, publishing, Workspace-native editor). 'comms' hosts the
          **Notifications** list surface for in-app notifications (e.g. dashboard
          sharing and permission requests; route may remain `/comms/alerts`). The
          'settings' module is **in-app settings** (user-scoped application preferences:
          appearance, language/region, workspace defaults, tools/export defaults, privacy, about)
          — v1 UI is a **non-persistent mock** in the shell sidebar and optional App Router page
          `/settings` (same sections; no persistence). **May 1 2026:** other `AppModule` keys (`home`, `assets`, …)
          SHALL gain the same URL-first navigation pattern as `workspace` (see
          business_rules: App Routing — module URL parity)."
      displayName: { type: string }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  Tool:
    fields:
      id: { type: uuid }
      moduleId: { type: uuid, references: AppModule.id }
      key:
        type: enum
        values: [data_sync, shift_log, documents, whatif, alert_setting]
        comment: "Canonical tool keys. `data_sync` is labeled **Data & Jobs** in the UI
          (two panels: **Data Status** + **FEA Jobs**). `alert_setting` is **Alert Setting** in the UI
          (equipment alert rules: parameters, composable conditions, assignees, schedules, delete/recover
          — v1 **mock**; Coker 01 only until fixtures exist for other primaries). 'shift_log' is a placeholder — no
          implementation built yet. All tools can be launched from the
          Equipment Home Page with an equipment pre-filter context where `supportsEquipmentFilter` is true."
      name: { type: string }
      isEnabled: { type: boolean, default: true }
      supportsEquipmentFilter:
        type: boolean
        default: false
        comment: "When true, the tool accepts an equipmentId context that
          pre-filters its content on entry (from Equipment Home Page tiles)."
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  EquipmentHomeView:
    comment: "Not a persisted entity — represents the UI state/context for the
      Equipment Home Page. Captured here for relationship traceability."
    fields:
      equipmentId: { type: uuid, references: Equipment.id }
      activeDashboardPopupId:
        type: uuid
        nullable: true
        references: Dashboard.id
        comment: "ID of the dashboard currently open in the read-only popup overlay.
          Null when no popup is open. At most one popup open at a time. The popup
          must use the same WorkspaceDashboard widget grid + catalog resolution
          as the Dashboard module read-only surfaces (see rules: read-only grid parity)."
      viewedDataScenarioId:
        type: uuid
        nullable: true
        references: WhatIfRunSession.id
        comment: "The What-If run session selected via Viewed Data inside the
          Dashboard Popup. Null when no overlay is applied."
      externalOpenTabCounts:
        type: map
        keyType: { type: uuid, references: Dashboard.id }
        valueType: { type: integer, min: 0 }
        comment: "Per-dashboard count of Full-Screen Viewer tabs currently open
          elsewhere (other browser tabs/windows). Maintained via cross-tab
          BroadcastChannel/storage signalling. Drives the 'open elsewhere'
          indicator on dashboard tabs / cards. A dashboard may be open in
          multiple tabs simultaneously."

  WorkspaceFolder:
    comment: "Per-user folder in the Workspace Module's Canva-like folder system.
      Folders form a nested tree owned by a single User. Dashboards live in
      exactly zero or one Folder (root = no folder)."
    fields:
      id: { type: uuid }
      ownerUserId: { type: uuid, references: User.id }
      parentFolderId:
        type: uuid
        nullable: true
        references: WorkspaceFolder.id
        comment: "Null = top-level folder under workspace root."
      name: { type: string }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  DashboardShare:
    comment: "A direct share grant from a dashboard owner to a specific User by
      name/email. Independent of ShareLink (link-based sharing)."
    fields:
      id: { type: uuid }
      dashboardId: { type: uuid, references: Dashboard.id }
      sharedByUserId: { type: uuid, references: User.id }
      sharedWithUserId: { type: uuid, references: User.id }
      permission:
        type: enum
        values: [view, comment, edit]
        comment: "Granted permission level for the shared-with user."
      message:
        type: string
        nullable: true
        maxLength: 500
        comment: "Optional plain-text note included with the share; surfaced in
          the recipient's Alert."
      notifyOnFirstView:
        type: boolean
        default: false
        comment: "If true, the sharer receives an Alert the first time the
          recipient opens this dashboard's popup."
      firstViewedAt:
        type: datetime
        nullable: true
        comment: "Timestamp when sharedWithUser first viewed the dashboard.
          Once set, do not retrigger the first-view Alert."
      revokedAt:
        type: datetime
        nullable: true
        comment: "Set when the sharer revokes access; revoked shares no longer
          grant permission and are hidden from recipient's 'Shared with me'."
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  ShareLink:
    comment: "A copyable shareable link for a dashboard. Anyone with the link
      and a signed-in identity gets the link's permission level."
    fields:
      id: { type: uuid }
      dashboardId: { type: uuid, references: Dashboard.id }
      createdByUserId: { type: uuid, references: User.id }
      token:
        type: string
        comment: "Unique opaque token used in the /share/[token] URL. Mock-generated."
      permission:
        type: enum
        values: [view, comment, edit]
      revokedAt:
        type: datetime
        nullable: true
        comment: "When set, the link refuses access (UI shows 'no longer valid')."
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  DashboardComment:
    comment: "A single comment on a dashboard, displayed in the Workspace popup's
      Comments side panel. Not threaded in v1."
    fields:
      id: { type: uuid }
      dashboardId: { type: uuid, references: Dashboard.id }
      authorUserId: { type: uuid, references: User.id }
      body:
        type: string
        maxLength: 2000
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  PermissionRequest:
    comment: "A request from a shared-with user asking for elevated permission
      (comment or edit) on a dashboard. Resolved by the sharer via Alert action."
    fields:
      id: { type: uuid }
      dashboardId: { type: uuid, references: Dashboard.id }
      requestedByUserId: { type: uuid, references: User.id }
      requestedToUserId:
        type: uuid
        references: User.id
        comment: "Typically the dashboard owner, or the original sharer."
      requestedPermission:
        type: enum
        values: [comment, edit]
      status:
        type: enum
        values: [pending, granted, denied, cancelled]
        default: pending
      resolvedAt:
        type: datetime
        nullable: true
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  Notification:
    comment: "An in-app notification for the current user, listed on the Comms Module
      **Notifications** surface and previewed from the header **Bell** (dropdown list plus
      short-lived compact previews anchored under the bell when new unread items arrive)."
    fields:
      id: { type: uuid }
      userId:
        type: uuid
        references: User.id
        comment: "Recipient — the user this alert appears for."
      category:
        type: enum
        values:
          - dashboard_shared_with_you
          - dashboard_first_view
          - permission_request_received
          - permission_request_resolved
          - edit_lock_blocked
          - operational_alert
        comment: "v1 categories. dashboard_shared_with_you: someone shared a
          dashboard with you. dashboard_first_view: a recipient opened a
          dashboard you shared (when notifyOnFirstView=true).
          permission_request_received: someone asked for higher permission on
          your dashboard. permission_request_resolved: your permission request
          was granted or denied. edit_lock_blocked: another user holds the edit
          lock the recipient attempted to acquire (implementation-specific).
          operational_alert: equipment alert rule fired (Alert Setting tool);
          SHOULD use stronger visual weight in Notifications + bell previews than
          workspace-comms categories; `actionHref` SHOULD deep-link Equipment Home
          for the subject equipment when set."
      dashboardId:
        type: uuid
        nullable: true
        references: Dashboard.id
      equipmentId:
        type: uuid
        nullable: true
        references: Equipment.id
        comment: "When category is operational_alert (or future equipment-centric notices),
          identifies the equipment context for navigation and copy."
      actionHref:
        type: string
        nullable: true
        comment: "In-app URL for row activation (e.g. Equipment Home path for operational_alert)."
      equipmentAlertRuleId:
        type: uuid
        nullable: true
        comment: "When category is operational_alert, optional FK to EquipmentAlertRule for dedupe / deep links."
      relatedShareId:
        type: uuid
        nullable: true
        references: DashboardShare.id
      relatedRequestId:
        type: uuid
        nullable: true
        references: PermissionRequest.id
      actorUserId:
        type: uuid
        nullable: true
        references: User.id
        comment: "The user whose action produced this Notification (sharer,
          recipient, requester, resolver)."
      title: { type: string }
      body: { type: string, nullable: true }
      archivedAt:
        type: datetime
        nullable: true
        comment: "When set, row is hidden from default inbox and bell lists (mock / client until API)."
      readAt:
        type: datetime
        nullable: true
        comment: "Null = unread. Set when user opens, navigates from, or marks the notification read."
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  DashboardViewerTabSession:
    comment: "Not a persisted entity — represents one browser tab currently
      rendering the Full-Screen Dashboard Viewer route. Maintained in-memory
      and broadcast cross-tab via BroadcastChannel/storage events. Used to
      compute EquipmentHomeView.externalOpenTabCounts."
    fields:
      sessionId:
        type: string
        comment: "Per-tab UUID generated on viewer mount."
      dashboardId: { type: uuid, references: Dashboard.id }
      userId:
        type: uuid
        nullable: true
        references: User.id
      openedAt: { type: datetime }
      lastHeartbeatAt: { type: datetime }

  WhatIfScenario:
    fields:
      id: { type: uuid }
      toolId: { type: uuid, references: Tool.id }
      equipmentId: { type: uuid, references: Equipment.id }
      name: { type: string }
      description: { type: string }
      details: { type: string, nullable: true }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  WhatIfScenarioParameter:
    fields:
      id: { type: uuid }
      scenarioId: { type: uuid, references: WhatIfScenario.id }
      name: { type: string }
      unit: { type: string, nullable: true }
      defaultValue: { type: string }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  WhatIfRunSession:
    fields:
      id: { type: uuid }
      scenarioId: { type: uuid, references: WhatIfScenario.id }
      equipmentId: { type: uuid, references: Equipment.id }
      requestedById: { type: uuid, references: User.id, nullable: true }
      runName: { type: string }
      status: { type: enum, values: [queued, running, success, failed, cancelled] }
      progressStep: { type: integer, min: 0, max: 5 }
      source: { type: enum, values: [tool, dashboard] }
      parameterInputMode: { type: enum, values: [full-csv, per-parameter-csv, typed, mixed] }
      startedAt: { type: datetime, nullable: true }
      completedAt: { type: datetime, nullable: true }
      durationSeconds:
        type: integer
        nullable: true
        comment: "# ASSUMPTION — UI currently stores formatted duration strings."
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  WhatIfRunInput:
    fields:
      id: { type: uuid }
      runSessionId: { type: uuid, references: WhatIfRunSession.id }
      parameterId: { type: uuid, references: WhatIfScenarioParameter.id, nullable: true }
      parameterNameSnapshot: { type: string }
      value: { type: string }
      sourceType: { type: enum, values: [typed, full_csv, per_parameter_csv, mixed] }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  WhatIfRunResult:
    fields:
      id: { type: uuid }
      runSessionId: { type: uuid, references: WhatIfRunSession.id }
      metricName: { type: string }
      value: { type: string }
      status: { type: enum, values: [pass, warning, fail] }
      included: { type: boolean, default: true }
      orderIndex: { type: integer }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  UserDocument:
    fields:
      id: { type: uuid }
      name: { type: string }
      fileType: { type: enum, values: [pdf, docx, xlsx, link] }
      category: { type: enum, values: [uploaded, shared] }
      subType: { type: enum, values: [general, whatif_parameter_report, whatif_visual_report], default: general }
      siteId: { type: uuid, nullable: true, references: Site.id }
      plantId:
        type: uuid
        nullable: true
        references: Unit.id
        comment: "Legacy field name in app types; value is a Unit id in the mock
          (e.g. unit-2007-hcu for HCU-scoped docs)."
      equipmentId: { type: uuid, nullable: true, references: Equipment.id }
      sourceRunSessionId: { type: uuid, nullable: true, references: WhatIfRunSession.id }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  ChangeLogEntry:
    fields:
      id: { type: uuid }
      type: { type: enum, values: [dashboard, operation] }
      action: { type: string }
      locationLabel: { type: string }
      userId: { type: uuid, nullable: true, references: User.id }
      occurredAt: { type: datetime }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  DataSyncStatus:
    fields:
      id: { type: uuid }
      equipmentId: { type: uuid, references: Equipment.id }
      totalFiles: { type: integer }
      loadedFiles: { type: integer }
      errorFiles: { type: integer }
      lastUpdatedAt: { type: datetime }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  SyncJob:
    fields:
      id: { type: uuid }
      equipmentId: { type: uuid, references: Equipment.id }
      userId: { type: uuid, nullable: true, references: User.id }
      description: { type: string }
      status: { type: enum, values: [queued, running, success, failed, cancelled] }
      startedAt: { type: datetime, nullable: true }
      completedAt: { type: datetime, nullable: true }
      elapsedSeconds: { type: integer, nullable: true }
      tokenCount: { type: integer, default: 0 }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  ClientSensorDatabaseSource:
    comment: "Client-owned database (or tunnel) from which the product system pulls
      near-realtime sensor / historian data. **Deferred** — May 2026 UI uses static fixtures
      in `lib/data-jobs-mock.ts`; align Prisma when the data platform epic starts."
    fields:
      id: { type: uuid }
      equipmentId: { type: uuid, references: Equipment.id }
      label: { type: string }
      engine: { type: string, comment: "e.g. TimescaleDB, InfluxDB, SQL Server." }
      connectionSummary: { type: string, comment: "Non-secret connection fingerprint for UI." }
      externalManagementUrl: { type: string, comment: "HTTPS link to vendor console (opens new tab)." }
      accessRole: { type: string, comment: "e.g. read-only ingest principal label." }
      isPrimary: { type: boolean, default: true }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  SensorIngestHealthSnapshot:
    comment: "Optional **equipment-level** roll-up of ingest health (counts, last error,
      coarse stream mode) for dashboards. Distinct from **per-sensor channel** ingest
      rows in the Data & Jobs **Data Status** UI, where cadence differs by instrument
      class (e.g. minutes for process sensors vs multi-month **laser scan** campaigns).
      **Deferred** persistence."
    fields:
      id: { type: uuid }
      equipmentId: { type: uuid, references: Equipment.id }
      streamMode: { type: enum, values: [near_realtime, batch, paused] }
      lastClientWriteAt: { type: datetime, nullable: true }
      lastSuccessfulPullAt: { type: datetime, nullable: true }
      avgPullIntervalSeconds: { type: number, nullable: true }
      lastErrorMessage: { type: string, nullable: true }
      healthyChannelCount: { type: integer }
      totalChannelCount: { type: integer }
      observedAt: { type: datetime }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  EquipmentAnalysisOutputDescriptor:
    comment: "Catalog row or tag describing a calculated / FEA-linked output the client
      receives (damage indices, stress fields, remaining life, 3D bundles, etc.). **Deferred**."
    fields:
      id: { type: uuid }
      equipmentId: { type: uuid, references: Equipment.id }
      name: { type: string }
      category:
        type: enum
        values: [damage, stress, life, geometry, inspection, scenario, other]
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  DataTransferLogEntry:
    comment: "Append-only ingest/export event for audit and operator review. **Deferred**."
    fields:
      id: { type: uuid }
      equipmentId: { type: uuid, references: Equipment.id }
      occurredAt: { type: datetime }
      direction: { type: enum, values: [pull, push] }
      status: { type: enum, values: [ok, warn, fail] }
      message: { type: string }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  UserApplicationPreference:
    comment: "Per-user in-app Settings persistence target (SaaS-style app preferences). **Deferred**
      — May 2026 shell exposes a read-only/mock sidebar only; no API or Prisma table required for mock."
    fields:
      id: { type: uuid }
      userId: { type: uuid, references: User.id, unique: true }
      theme:
        type: enum
        values: [system, light, dark]
        default: system
      locale: { type: string, comment: "BCP 47 tag, e.g. en-US." }
      timeZone: { type: string, comment: "IANA zone id, e.g. America/Chicago." }
      workspaceDefaultLifecycle:
        type: enum
        values: [created, published]
        comment: "Default for new dashboards from editor; product decision TBD."
      analyticsOptIn: { type: boolean, default: false }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  EquipmentAlertRule:
    comment: "User-authored equipment monitoring rule created in the **Alert Setting** tool
      (`Tool.key = alert_setting`). v1 persists rules in **browser storage** (same device / origin) until a
      server-backed API exists. **draft** rules are owner-visible only; **active** rules appear to assignees in-tool.
      In-app edits are **Edit-mode gated**. **Test** sends preview **operational_alert** notifications to the owner
      and all assignees (deduped). **Create** collects name, parameters, predicates, combine logic, schedule, and
      assignees before first save. **Coker 01** (`equipment-a`) has full UX; other primaries show **coming soon**
      until fixtures align with Data & Jobs **Data Status** parameter catalogs."
    fields:
      id: { type: uuid }
      ownerUserId: { type: uuid, references: User.id }
      equipmentId: { type: uuid, references: Equipment.id }
      name: { type: string }
      status:
        type: enum
        values: [draft, active, archived_deleted]
        default: draft
      scheduleMode:
        type: enum
        values: [one_shot, recurring, date_window]
        comment: "one_shot: fire at most once when armed; recurring: cron-like or interval (TBD);
          date_window: active only between optional start/end instants."
      schedulePayload:
        type: json
        comment: "Structured schedule details (intervals, timezone, recurrence spec) — schema TBD."
      logicalExpression:
        type: json
        comment: "Boolean DAG over condition leaves with AND / OR / NOT and explicit grouping order.
          Each leaf binds one equipment parameter (sensor channel, process scalar, or analysis output)
          to one or more predicates. Predicate families include: threshold (< ≤ > ≥), open and closed
          intervals between two bounds (e.g. a < x < b, a ≤ x < b, a < x ≤ b, a ≤ x ≤ b), OR-complements
          outside an interval (< or >, ≤ or >, < or ≥, ≤ or ≥), monotonic **increase slope** / **decrease slope**
          (rate-of-change / derivative templates over a window), plus extensible statistical templates
          (moving average deviation, cumulative drift) as the product matures. Multiple predicates per
          parameter are allowed when jointly satisfiable; engine MUST reject mathematically contradictory
          compositions at activation time."
      createdAt: { type: datetime }
      updatedAt: { type: datetime }
      deletedAt: { type: datetime, nullable: true, comment: "Soft delete; retained for history / recover." }

  EquipmentAlertAssignee:
    comment: "Recipient of alert notifications for a rule; permissions gate in-tool edits and delete requests."
    fields:
      id: { type: uuid }
      ruleId: { type: uuid, references: EquipmentAlertRule.id }
      assigneeUserId: { type: uuid, references: User.id }
      accessLevel:
        type: enum
        values: [notify_only, comment_on_alert, co_edit_rule]
        comment: "notify_only: receive operational_alert only. comment_on_alert: annotate rule (mock thread TBD).
          co_edit_rule: change conditions/schedule with owner-approved semantics (product mirrors dashboard edit trust)."
      mayInitiateDeleteRequest: { type: boolean, default: false }
      createdAt: { type: datetime }
      updatedAt: { type: datetime }

  EquipmentAlertDeleteRequest:
    comment: "Assignee-initiated request to remove a shared rule; owner accepts or rejects."
    fields:
      id: { type: uuid }
      ruleId: { type: uuid, references: EquipmentAlertRule.id }
      requesterUserId: { type: uuid, references: User.id }
      status:
        type: enum
        values: [pending, accepted, rejected]
        default: pending
      createdAt: { type: datetime }
      resolvedAt: { type: datetime, nullable: true }

relationships:
  - "An **Equipment** has an `equipmentTypeKey` that selects which **EquipmentKnowledgePack** and **CatalogWidgetTemplate** rows apply in the Widget Library (filter: pack.equipmentTypeKey match)."
  - "A **ParameterFamily** belongs to one **EquipmentKnowledgePack**; pack rows are versioned; only the product team creates or updates packs via release processes (not in customer UI)."
  - "A **CatalogWidgetTemplate** belongs to one **EquipmentKnowledgePack**; it references zero or one **ParameterFamily** (null for control-only templates such as time range)."
  - "A **ParameterRequest** is created by a **User**; it optionally references an **Equipment**; only **User**s with `role = product_team` (or an admin surface) list and update request status in v1."
  - "Workspace Zustand `WorkspaceDashboard.widgets[]` (implementation) shall store per-tile: `templateKey` (or id), `x`, `y`, `w`, `h`, `minW`, `minH`, `displayTitle` override, `options` JSON, and `packVersion` string at save time — see PROJECT.md and `scripts/prd.txt`."
  - "A Site has many Units; a Unit belongs to one Site. (Mock JSON uses `site.units`.)"
  - "A Unit has many Equipment; an Equipment belongs to one Unit (Equipment.unitId).
    Optional: Site may also have Plants for other deployments; the Apr 2026 mock
    is Site → Unit → Equipment only."
  - "A Site may have many Plants; a Plant belongs to one Site. (Not interposed between Site and Unit in the current mock profile.)"
  - "An Equipment has zero or many Dashboards."
  - "A Widget can appear in many Dashboards via DashboardWidget."
  - "A Dashboard has many DashboardWidgets; each DashboardWidget references one Widget."
  - "A Tool belongs to one AppModule; What-If Scenario and **Alert Setting** are Tools under the Tools (`insights`) module."
  - "A WhatIfScenario belongs to one Equipment."
  - "A WhatIfScenario has many parameters and many run sessions (history)."
  - "A WhatIfRunSession has many inputs and many results."
  - "A UserDocument can optionally reference Site, Unit (field name plantId in legacy types), Equipment, and source WhatIfRunSession."
  - "A DataSyncStatus belongs to one Equipment."
  - "A SyncJob belongs to one Equipment and optionally one User."
  - "An Equipment has zero or many ClientSensorDatabaseSource rows (ordered; at most one primary is typical)."
  - "SensorIngestHealthSnapshot belongs to one Equipment when persisted; it summarizes aggregate ingest health and does not replace per-channel ingest state in the product model."
  - "EquipmentAnalysisOutputDescriptor belongs to one Equipment; lists what outputs the product returns for monitoring."
  - "DataTransferLogEntry belongs to one Equipment; supports Data Status 'transfer log' and audit."
  - "UserApplicationPreference belongs to exactly one User when persisted (1:1)."
  - "An EquipmentHomeView is scoped to one Equipment and can show one Dashboard via popup at a time."
  - "Navigating from an EquipmentHomeView tool tile to a Tool passes the Equipment context as a pre-filter; the Tool's supportsEquipmentFilter flag indicates this is supported."
  - "The Workspace AppModule is the target for the Equipment Home Page 'Edit Dashboards' action; the equipment context is forwarded so the Workspace pre-filters on that equipment."
  - "A Dashboard has exactly one owner User (Dashboard.ownerUserId) and zero or many contributor Users."
  - "A Dashboard belongs to zero or one WorkspaceFolder; a WorkspaceFolder belongs to exactly one User and may have a parent WorkspaceFolder (nested tree)."
  - "A Dashboard has zero or many DashboardShares (one per shared-with User) and zero or many ShareLinks."
  - "A Dashboard has zero or many DashboardComments authored by Users with comment or edit permission (or by the owner)."
  - "A PermissionRequest references one Dashboard, the requester User, and the resolver User (typically the owner)."
  - "A Notification references one recipient User and optionally a Dashboard, DashboardShare, PermissionRequest, Equipment, EquipmentAlertRule, and actor User."
  - "An **EquipmentAlertRule** belongs to one **Equipment** and one owner **User**; it has zero or many **EquipmentAlertAssignee** rows and zero or many **EquipmentAlertDeleteRequest** rows."
  - "A **Notification** with category **operational_alert** SHOULD reference **equipmentId** (and optionally **equipmentAlertRuleId**) and SHOULD populate **actionHref** to the Equipment Home route for that equipment."
  - "A DashboardViewerTabSession is scoped to one Dashboard and is signalled cross-tab; the EquipmentHomeView aggregates active sessions into externalOpenTabCounts per dashboard."

business_rules:
  - "KPI is represented as a Widget subtype; there is no separate EquipmentKPI entity."
  - "Users can create a dashboard from blank or clone an existing dashboard; name must be unique per equipment."
  - "Users can drag/drop, resize, and remove widgets while editing dashboards, but only in the **Dashboard module** authoring surface (App Router editor); the Asset module does not provide a parallel in-place editor for the same capability."
  - "The **Dashboard module** lists and opens `WorkspaceDashboard` records; the user does not author dashboards via a legacy in-shell equipment tab strip. Switching which dashboard to edit is done from Equipment Home, Site/Plant stacks, or Dashboard module navigation — not from a second editor with bottom tabs."
  - "Creating a new dashboard in the **Dashboard module** must land the user in the editor or grid for that new `WorkspaceDashboard` (URL-driven), not a legacy `currentView`-only flow."
  - "Users can queue multiple What-If runs while another run is running."
  - "The old rule requiring selected dashboards for a run is removed."
  - "What-If results can be surfaced through Viewed Data on the **Equipment Home Page** read-only dashboard popup (and any other read-only grid that wires `viewedDataIds` into widgets)."
  - "What-If Scenarios are accessed from the Tools module."
  - "Primary Tools module App Router pages (Data & Jobs, What-If Scenario, Documents, Alert Setting) use a **shared page chrome** (breadcrumb **Tools** → tool name, shared title and description styling, optional route chip) for consistency; **navigation and tool behavior** (including the first breadcrumb targeting `/tools/data-sync` with `MainRouteSync`) remain as before."
  - "Documents generated from runs are stored in the same document library."
  - "For the current mock profile, Site 2000 has three units: Unit 2006 - DCU, Unit 2007 - HCU, Unit 2008 - Hydrogen Unit. Primary equipment are Coker 01 (ex Coke Drum, id equipment-a), HCU 01 (id equipment-b), SMR Pigtails (ex SMR Unit A, id equipment-c), with all prior tab sets and seed dashboards preserved for those ids."
  - "For the current mock profile, SMR Pigtails (equipment-c) has a dashboard tab named 'SMR Pigtail Integrity'."
  - "For the current mock profile, dashboard widgets for the hydrogen unit coker and SMR equipment are scenario-appropriate, including a model_view widget for SMR mockup where applicable (not a generic pump geometry for SMR content)."
  - "Placeholder equipment (Coker 02, Coker Furnace, HCU 02, SMR Catalyst Tubes) have no linked dashboards, What-If, or tool navigation; they are menu-only nodes."
  - "Navigating to an Equipment asset from the Asset module hierarchy now lands on the Equipment Home Page, not directly on the dashboard editor."
  - "The Equipment Home Page groups the equipment's dashboards into Recent and Favourites sections; Dashboard.lastAccessedAt drives Recent; Dashboard.isFavorite drives Favourites."
  - "The Dashboard Popup on the Equipment Home Page is strictly read-only; widget editing controls (drag, resize, add, remove) must be hidden."
  - "At most one Dashboard Popup may be open at a time on the Equipment Home Page."
  - "Viewed Data, generate-report, and share functions are available inside the Dashboard Popup, reusing the existing mechanism."
  - "The Tools Section on the Equipment Home Page shows fixed tiles: Data & Jobs, Shift Log, Documents, What-If Scenario; **Alert Setting** is listed in the **Tools (Insights)** module rail (`Tool.key = alert_setting`, `/tools/alert-setting`) and MAY gain an Equipment Home tile in a later iteration."
  - "Shift Log tool tile is a non-interactive placeholder; clicking it has no effect."
  - "Clicking Data & Jobs, Documents, What-If Scenario, or **Alert Setting** (when linked from Equipment Home) navigates to the Tools module with equipmentId pre-applied as a filter via Zustand state where the tool supports equipment filtering."
  - "The Data & Jobs tool page (`Tool.key = data_sync`, route `/tools/data-sync`) has two primary panels presented as **tabs**: **Data Status** (client DB + per-channel ingest + outputs + log/configure/export — sample UI until backend) and **FEA Jobs** (job list unchanged from prior Sync & FEA Jobs table)."
  - "The Data & Jobs tool page must support equipment-level filtering; navigating from the Equipment Home Page pre-applies the source equipment filter."
  - "Data Status (May 2026): **Coker 01** shows full static fixture (sensor tags TI6001–TI6004, PI6001–PI6003, CI6001, SI6001, FI6001, ZI6001; outputs include Fatigue Damage, Stress, Remaining Life, PSLF, Bulging, Ovality, FAD, Displacement, Crack). **HCU 01** and **SMR Pigtails** show non-persistent loading-placeholder panels until fixtures exist."
  - "Data Status **ingest** presentation is **per sensor channel** (not a single equipment-wide 'stream' card): expected update cadence and last-pull timestamps vary by instrument class — e.g. thermocouple, pressure, coke level, steam rate, and flow channels on the order of **minutes** (~5 min sample cadence), versus **laser scan** geometry captured on **multi-month** campaign boundaries (~3 months sample cadence)."
  - "Data Status actions (transfer log, open client DB console in new tab, configure/add source form, export CSV/XML/JSON sample or future API) must not mutate Workspace, Prisma, or Zustand persisted slices beyond ephemeral UI state (open/close dialogs)."
  - "The **Alert Setting** tool (`Tool.key = alert_setting`, route `/tools/alert-setting`) is **not** the retired **Settings → Alert Settings** surface; it lives under **Tools / Insights** beside Data & Jobs, Documents, and What-If."
  - "Alert Setting v1: users define **EquipmentAlertRule** rows scoped to an equipment, pick **one or many** monitored parameters (unlimited in product intent; initial build may cap count), compose **logicalExpression** DAGs across parameters (AND / OR / NOT with explicit grouping), attach per-parameter predicates (thresholds, interval bands, OR-outside-band forms, slope / rate-of-change templates, extensible numeric templates), choose **scheduleMode** (one_shot | recurring | date_window), assign **EquipmentAlertAssignee** users with **accessLevel** (notify_only | comment_on_alert | co_edit_rule) and optional **mayInitiateDeleteRequest**, manage multiple rules per equipment, edit when permitted, soft-delete with **archived_deleted** and **Deleted alert history** (recover + edit), and process **EquipmentAlertDeleteRequest** accept/reject flows."
  - "Alert Setting scope (May 2026): **Coker 01** (`equipment-a`) has full interactive UX wired to the same **input** (Temperature via TI6001–TI6004 family, Pressure PI6001–PI6003, Coke Level CI6001, Steam Rate SI6001, Flow Rate FI6001, Laser ZI6001) and **output** names (Fatigue Damage, Stress, Remaining Life, PSLF, Bulging, Ovality, FAD, Displacement, Crack) as the Data & Jobs **Data Status** fixtures (`lib/data-jobs-mock.ts`). **HCU 01** and **SMR Pigtails** show **coming soon** in-tool until fixtures exist."
  - "Alert Setting **does not** evaluate live telemetry in the current build; crossing detection is **no-op** except an explicit per-rule **Test** control that enqueues a demonstration **operational_alert** Notification for every assignee (and owner if desired) with **actionHref** targeting that equipment's **Equipment Home** URL."
  - "Comms **Notifications** UI SHALL render **operational_alert** rows with **stronger visual weight** (typography, border, icon treatment) than workspace-comms categories so field alerts are immediately distinguishable."
  - "The **Edit Dashboards** action on the Equipment Home Page navigates to the **Dashboard module** (`/dashboard` or deeper, equipment filter pre-applied) so the user can open the **only** supported authoring experience: `/dashboard/dashboard/[dashboardId]/edit`. There is no second editor in `currentView: equipment` for the same product capability."
  - "The `workspace` `AppModule.key` maps to the **Dashboard** product surface; the shell may still use `setActiveModule`/`currentView` for other legacy views, but dashboard **editing** is not one of them — editing is always URL-driven to the App Router editor."
  - "From Site Overview and Plant Overview dashboard tab stacks, clicking a dashboard tab must navigate to Equipment Home Page and auto-open the matching read-only Dashboard Popup tab for that equipment."
  - "From Site Overview and Plant Overview dashboard tab stacks, clicking the equipment-name label must navigate to that equipment's Equipment Home Page without auto-opening a dashboard popup."
  - "Equipment-name labels in dashboard tab stacks are interactive link-style controls (explicit clickable affordance) and must not trigger tab expansion when clicked."
  # ── Workspace Module (UI label: Dashboard) ─────────────────────────────────
  - "The AppModule key `workspace` is shown to users as **Dashboard** in module-rail and related UI chrome; implementation names remain Workspace (stores, lib/workspace) while public URLs use `/dashboard/*` to avoid ambiguity with the Dashboard entity."
  - "The Workspace Module is per-user: a user sees only their own dashboards, their own folders, and dashboards explicitly shared with them. Other users' workspaces are not visible."
  - "Each Dashboard has exactly one owner User; ownership is set at creation and does not change via sharing or publishing."
  - "Dashboard.lifecycleStatus transitions are: created -> published (publish action) and published -> created (unpublish action), both performed only by the owner."
  - "A 'created' dashboard is visible only to its owner and to users it has been shared with (DashboardShare or ShareLink); it never appears in the Asset Module."
  - "A 'published' dashboard is visible in the Asset Module Equipment Home Page to users with access to its Site/Plant/Equipment, AND remains in the owner's Workspace (publishing does not remove it)."
  - "The Asset Module Equipment Home Page shows only published dashboards for the equipment; created/draft dashboards are hidden from Asset Module."
  - "WorkspaceFolders are user-owned and form a nested tree rooted at workspace root (parentFolderId = null); UI must support at least 5 levels of nesting."
  - "A Dashboard belongs to zero or one WorkspaceFolder owned by the same User as the dashboard owner; moving a dashboard updates only Dashboard.folderId."
  - "Deleting a WorkspaceFolder requires the user to choose 'move contents to root' or 'delete contents' (cascade soft-delete)."
  - "Users can search and filter dashboards in their Workspace by equipment, lifecycleStatus, owner (creator), contributor, and lastChangeAt date range."
  - "Users can create, duplicate, rename, move, and soft-delete their own dashboards from the Workspace; soft-deleted dashboards live in Trash with deletedAt set."
  - "Duplicating a dashboard creates a new Dashboard with a new id, lifecycleStatus='created', sourceDashboardId set to the original, name prefixed 'Copy of ', folderId copied from the original, and ownerUserId set to the duplicating user."
  - "The Workspace Dashboard Popup exposes three independent actions: expand-to-fullscreen (within the same tab), toggle Comments side panel, and Edit dashboard."
  - "The Workspace Dashboard Popup additionally exposes 'Open in new tab', which navigates a new browser tab to the Full-Screen Dashboard Viewer route and closes the popup in the originating tab."
  - "Edit and Comment in the Workspace Dashboard Popup are always enabled for the dashboard owner. For shared-with users they are enabled iff the active DashboardShare or ShareLink grants edit/comment permission, respectively."
  - "Saving a dashboard edit by a non-owner with edit permission appends that user to Dashboard.contributorUserIds (idempotent) and updates lastChangeAt and lastChangeByUserId."
  - "The **Workspace-native / Dashboard module** editor (e.g. `components/workspace/dashboard-editor.tsx` mounted at `/dashboard/dashboard/[id]/edit`) is the **sole** interactive dashboard authoring engine. It reuses the Widget Library catalog; the legacy `EquipmentDashboard` in-shell editor is **retired** (removed or reduced to a non-editing entry point only). A single `WorkspaceDashboard` row in `useWorkspaceStore` is the only persisted layout source for widgets."
  # ── Catalog-driven dashboard library (Coker v1+; see scripts/prd.txt) ─────────
  - "The product team ships **EquipmentKnowledgePack** versions per `equipmentTypeKey` (e.g. coker); end users and customers do not author new **ParameterFamily** or **CatalogWidgetTemplate** rows in the UI."
  - "The Widget Library in the Dashboard module editor lists only **CatalogWidgetTemplate** entries whose pack matches the dashboard’s equipment `equipmentTypeKey` (and any **ParameterFamily** add-ons in `Equipment.parameterAddonKeys`)."
  - "Each placed widget instance stores a **template key**, **whitelisted options**, user **display title** override, grid box, and **packVersion**; global **dashboard time/cycle** context applies to templates with `followsDashboardContext = true`."
  - "Users may submit a **ParameterRequest** from the app; requests are listed only for **product_team** (or a designated admin surface), not for general share-link recipients."
  - "Duplicating a dashboard to another **Equipment** requires the same **equipmentTypeKey**; cross-type duplicate is blocked with a user-visible message."
  - "Full-screen dashboard viewer and export/print must use the same **CatalogWidgetTemplate** renderers and **Coker** (or type) **theme** as the editor preview for pixel-consistent reports (see NFR in PRD)."
  - "Coker v1 templates of **kind** `raster_image` (3D model, bulging inspection heatmap, total fatigue damage shell, crack inspection / unwrapped map) render from **static image files** under the app’s `public/coker/widgets/` directory; canonical URL paths are defined in `lib/equipment-packs/coker-widget-images.ts` until a CMS or API provides assets."
  - "**Authentication (production):** identity is bound to a server-side **Session** (and optional **Account** for OAuth) referencing **User**; `passwordHash` and tokens are never exposed in API responses. The legacy mock **user switcher** and `isCurrentUser` are development-only; remove or gate behind `NODE_ENV` before GA."
  - "**Cross-device data:** per-user **Workspace** state (dashboards, folders, shares, notifications) must be loaded from a **server-authoritative** database, not from browser `localStorage` alone, so all signed-in devices see the same data."
  - "**UI mock free-text (explicit OUT OF SCOPE for first cloud milestone):** change log, recent activity rows, What-If run list display strings, and similar copy in `lib/data.ts` / static fixtures may keep mock names until a later epic migrates them to user-linked audit rows; do not require replacing these strings in the initial auth + workspace persistence work."
  # ── (end catalog-driven) ─────────────────────────────────────────────────
  - "DashboardShare grants are per-recipient and may be revoked; revoked shares no longer grant access and are hidden from the recipient's 'Shared with me'."
  - "ShareLink grants permission to any signed-in user that opens the link; if revoked, the link refuses access."
  - "A user with view permission may not comment or edit; comment permission implies view; edit permission implies comment+view."
  - "Users without comment/edit permission on a shared dashboard may submit a PermissionRequest from the Dashboard Popup; this generates a 'permission_request_received' Notification for the dashboard owner."
  - "Resolving a PermissionRequest (granted/denied) generates a 'permission_request_resolved' Notification for the requester; granting also creates or upgrades the corresponding DashboardShare."
  - "When DashboardShare.notifyOnFirstView is true, the first time the recipient opens the dashboard popup sets DashboardShare.firstViewedAt and produces a 'dashboard_first_view' Notification for the sharer; this fires at most once per share."
  - "Comments on owner-owned dashboards do NOT generate Notifications for comment activity; sharing-related events always do. Additional operational categories (e.g. edit-lock contention) MAY surface as Notifications when implemented."
  - "**Authentication & main shell (May 1 2026 rev 2):** Routes under the signed-in application shell (e.g. `/home`, `/assets/*`, `/tools/*`, and other primary module pages that render sidebar+header) require an authenticated **Session**; anonymous visitors are redirected to `/login` with return-to intent preserved where practical. `/` may redirect to `/home` for signed-in users and to `/login` (or `/home` then login) per implementation; the product default landing after sign-in is `/home`."
  - "**Home welcome:** The Home page welcome line SHALL use the signed-in **User** display name (or session name fallback), not a hard-coded mock string."
  - "**Shell user affordance:** The module rail’s bottom user control SHALL show the first letter of the signed-in user’s display name (fallback initial) and open an account menu (read-only identity fields, **Sign out**). Duplicating the user’s email in the top header chrome is not required and SHOULD be removed in favor of this menu."
  - "**Header chrome:** The top-right **Settings** gear control in the global header SHALL be removed (Settings remains reachable via the module rail). The **Bell** SHALL mirror Comms **Notifications**: same unread count semantics as the Comms rail badge, a dropdown list consistent with the full **Notifications** page, and **ephemeral preview cards** for newly received unread items — compact, dropdown-styled, anchored **directly under the bell** (not a full-width page strip), auto-dismissed after a **short TTL**; global Sonner toasts SHALL NOT be used as the delivery channel for routine new-notification previews."
  - "The Comms Module **Notifications** page lists all Notifications for the current user in reverse-chronological order; selecting a row SHALL navigate to the in-app context implied by the notification when one exists (at minimum: when `dashboardId` is set, open the **Dashboard** module for that dashboard and mark read consistent with today’s 'View' behavior). Additional targets MAY be derived from `category`, `relatedShareId`, and `relatedRequestId` as the product matures."
  - "The Comms module rail **Notifications** entry shows an unread-count badge equal to count(Notification where readAt is null for the current user)."
  - "The **Settings** `AppModule` surfaces **in-app application settings** (appearance, language/region, workspace defaults, tools/export defaults, privacy, about). v1 is **non-persistent**: controls do not write to PostgreSQL or external services. Legacy sidebar labels **General**, **Integrations**, and **Alert Settings** are **retired** from Settings; in-app notification feed remains under **Comms → Notifications** only."
  - "Account identity (sign-out, read-only profile) stays on the module-rail **user** control; Settings does not duplicate full account management in v1."
  # ── Asset Module — Full-Screen Viewer & Multi-Tab ──────────────────────────
  - "The Equipment Home Page Dashboard Popup includes 'Open in new tab', which opens /dashboards/[dashboardId]/full in a new browser tab and closes the popup in the originating tab."
  - "The Full-Screen Dashboard Viewer route renders the dashboard widget grid with no app sidebar and no header, in read-only mode."
  - "A dashboard may be open simultaneously in multiple Full-Screen Viewer tabs; each tab maintains a DashboardViewerTabSession."
  - "Cross-tab open-state signalling uses BroadcastChannel with a localStorage 'storage'-event fallback; on viewer mount a tab broadcasts JOIN, on pagehide/beforeunload it broadcasts LEAVE; periodic heartbeat reconciles stale sessions."
  - "When a dashboard is open in any browser tab other than the current Equipment Home Page tab, an indicator icon (with optional count) appears on that dashboard's tab/card on the Equipment Home Page; the indicator updates live."
  # ── App Routing ────────────────────────────────────────────────────────────
  - "New surfaces are URL-driven via Next.js App Router routes: /dashboard, /dashboard/folder/[folderId], /dashboard/shared, /dashboard/recent, /dashboard/trash, /dashboard/dashboard/[dashboardId]/edit, /dashboards/[dashboardId]/full, /share/[token]."
  - "**Module URL parity (May 1 2026):** Home, Asset module (Site Overview, Plant Overview, Equipment Home), and Tools module primary views (Data & Jobs, What-If Scenario, Documents) SHALL migrate from store-only `currentView` switching on `/` to dedicated App Router routes so users get the same **real navigation** semantics (history stack, reload-stable deep links) as the Workspace (**Dashboard**) module. Exact path map and any query-string encoding for pre-filters (e.g. equipment context from Equipment Home tool tiles) are implementation choices recorded in PROJECT.md; **visual and behavioral parity** with the pre-migration UI is mandatory."
  - "Until migration is complete, legacy surfaces MAY still render via `currentView` on `/` as a transitional implementation detail; production target is **no** primary module relying solely on in-memory view switching without a URL."
  - "The Workspace module rail submenu is a single-level list containing exactly: 'All Dashboards', 'Shared with me', 'Recent', 'Trash'. No nested submenu is permitted."
  - "The Workspace Module renders exactly one in-module navigation menu surface. A second parallel menu panel is not allowed."
  - "The single Workspace in-module menu must preserve all existing Workspace navigation and information functions: All Dashboards, Shared with me, Recent, Trash, folder tree expansion/collapse, folder selection, and dynamic badges/counters."
  - "The single Workspace in-module menu must use the established module submenu visual language (dark-blue panel styling used by other module submenus) while preserving feature parity with the previous white Workspace menu."
  # ── Canonical Dashboard Data Source (Apr 27 2026 rev 2) ─────────────────────
  - "WorkspaceDashboard is the canonical source of truth for all dashboard metadata across the entire application; no module may maintain a separate static dashboard registry."
  - "The legacy static dashboardCards array in lib/data.ts is deprecated; it must not be consulted as the primary source for dashboard identity, name, widget content, or display metadata in any module. Equipment Home Page, Home Page, Site Overview, and Plant Overview derive dashboard data from WorkspaceDashboard records."
  - "Equipment Home Page Dashboard collections are derived exclusively from WorkspaceDashboard records where lifecycleStatus = 'published' and deletedAt is null, filtered by equipmentId. The adapter lib/workspace-data.ts provides getPublishedDashboardsForEquipment() for this derivation."
  - "The EquipmentHomeDashCard adapter type (id: WorkspaceDashboard.id, equipment: equipment.name, equipId: WorkspaceDashboard.equipmentId, tag: WorkspaceDashboard.name, metrics: deterministic mock) is the cross-module display shape for published dashboards; it is structurally compatible with the legacy dashboardCards shape to preserve rendering in DashboardCard, DashboardTabStack, and Home Page DashboardCardRow."
  - "The Equipment Home Page Dashboard Popup must render `WorkspaceDashboard.widgets` using the **same read-only grid component and widget body resolution** as the Workspace module popup and the Full-Screen Dashboard Viewer (`/dashboards/[dashboardId]/full`): catalog tiles resolve via `templateKey` + `DashboardWidgetBody` (e.g. Coker `CokerTemplateView`), with matching `react-grid-layout` column/row/breakpoint settings and equipment-type theming. A separate code path that invokes only `WidgetViewResolver` from `viewType` (omitting `templateKey` / catalog renderers) does not satisfy this rule — it breaks layout and shows placeholder or legacy content for catalog-backed dashboards."
  - "WorkspaceDashboard.widgets is the single widget layout source for Equipment Home Dashboard Popup, Full-Screen Viewer (/dashboards/[id]/full), and Workspace popup viewer. DEFAULT_WIDGET_SETS and buildDefaultGrid from layouts.ts are used only during Workspace seed generation; they must not be imported at render time by Equipment Home or Home modules."
  - "Home Page Recent Dashboards and Favorite Dashboards sections store WorkspaceDashboard.id values in useAppStore; display metadata (name, thumbnail, equipment name) is resolved from useWorkspaceStore at render time via getDashboardById."
  - "Site Overview and Plant Overview Dashboard Tab Stacks derive their card lists from published WorkspaceDashboard records using the same getPublishedDashboardsForEquipment adapter; dashboardCards is not consulted."
  - "Dashboard identity is shared between the Workspace Module and all Asset Module surfaces via WorkspaceDashboard.id as the canonical key; recents, favorites, cross-tab presence signals, and auto-open state all use WorkspaceDashboard.id."
  - "The Equipment Home Page OpenElsewhereBadge and useDashboardOpenElsewhereCount hook use WorkspaceDashboard.id as the presence key; the legacy key format 'equipment-{equipId}-{tag}' is replaced."
  - "When the user completes a What-If Scenario run and chooses 'View Data' on the result, navigation goes to the Equipment Home Page scoped to that run's Equipment only; no Dashboard Popup opens automatically. The run remains queued for Viewed Data overlay via WhatIfRunSession auto-select so that when the user opens any dashboard popup on that Equipment, the scenario run can be selected in Viewed Data without forcing a specific WorkspaceDashboard."
  - "The legacy Full-Screen Viewer route /equipment-dashboard/[equipmentId]/[tag]/full is superseded; Equipment Home popup Open-in-new-tab now opens /dashboards/[WorkspaceDashboard.id]/full. The legacy route may remain for backward compatibility but is not the primary navigation path."
  - "All Workspace seed data in lib/workspace/seed.ts must include published WorkspaceDashboard entries for every tab present in equipment.tabs (lib/data.ts); this guarantees Equipment Home visual parity after removing dashboardCards as the source."
  - "PostgreSQL deployments shall upsert the same deterministic Workspace bundle (`WORKSPACE_SEED`) via `pnpm db:seed` (`prisma/seed-workspace.ts`) after users and the Site/Unit/Equipment hierarchy are seeded from lib/data.ts. Signed-in clients load this data through `/api/workspace/bootstrap`; **equipment-a**, **equipment-b**, and **equipment-c** must exist before POST /api/workspace/dashboards will accept creates for Coker 01, HCU 01, and SMR Pigtails."

invariants:
  - "Every entity has id, createdAt, and updatedAt."
  - "Dashboard name is unique within one Equipment."
  - "DashboardWidget layout must satisfy x >= 0, y >= 0, w >= minW, h >= minH."
  - "For 12-column layout, x + w <= 12."
  - "WhatIfRunSession.progressStep is between 0 and 5."
  - "Valid run state progression is queued -> running -> success|failed|cancelled."
  - "If run status is success, completedAt is not null and at least one result exists."
  - "If document category is shared, sharedBy semantics are required. # ASSUMPTION — sharedBy currently inferred from prototype fields."
  - "If UserDocument.equipmentId is set with site/unit, asset hierarchy references must be consistent."
  - "DataSyncStatus.loadedFiles + errorFiles <= totalFiles."
  - "EquipmentHomeView.activeDashboardPopupId, if set, must reference a Dashboard that belongs to EquipmentHomeView.equipmentId."
  - "EquipmentHomeView.viewedDataScenarioId, if set, must reference a WhatIfRunSession that belongs to the same Equipment."
  - "Tool.key must be one of [data_sync, shift_log, documents, whatif, alert_setting]; shift_log tiles render in disabled state with no navigation."
  - "Exactly one User has User.isCurrentUser = true at any given time."
  - "Dashboard.ownerUserId is non-null for every dashboard."
  - "Dashboard.folderId, when non-null, references a WorkspaceFolder whose ownerUserId equals Dashboard.ownerUserId."
  - "WorkspaceFolder.parentFolderId, when non-null, references a WorkspaceFolder owned by the same User."
  - "WorkspaceFolder names are unique among siblings under the same parentFolderId for the same owner."
  - "Dashboard.lifecycleStatus = 'published' implies Dashboard.publishedAt is non-null."
  - "Dashboard.lifecycleStatus = 'created' implies the dashboard does not appear in any Asset Module surface."
  - "DashboardShare is unique on (dashboardId, sharedWithUserId) excluding revoked rows."
  - "DashboardShare.permission ordering is view < comment < edit; raising the permission via PermissionRequest grant must not lower it."
  - "ShareLink.token is globally unique."
  - "PermissionRequest.requestedPermission is one of [comment, edit] (view is the implicit baseline)."
  - "PermissionRequest.status transitions: pending -> granted | denied | cancelled; resolved (granted/denied) requires resolvedAt non-null."
  - "Notification.readAt, when set, is >= Notification.createdAt."
  - "Notification.category 'dashboard_first_view' fires at most once per DashboardShare (enforced via DashboardShare.firstViewedAt)."
  - "DashboardComment.authorUserId must have at least comment permission on the Dashboard at the time of creation (owner trivially satisfies this)."
  - "DashboardViewerTabSession.lastHeartbeatAt is updated at most every 5 seconds; sessions older than 15 seconds without heartbeat are considered stale and pruned."
  # ── Locked open-question resolutions (Apr 27 2026) ─────────────────────────
  - "Organization users are a fixed mock list; no invite-new-user flow exists."
  - "ShareLink access is restricted to users who exist in the organization directory; opening a link as anyone outside the directory blocks access with a 'not authorised' state. On save with edit permission via a link, the user is appended to Dashboard.contributorUserIds."
  - "Unpublishing a Dashboard does NOT revoke any DashboardShare or ShareLink. Asset Module is treated as a read-only 'qualified dashboards' surface; publish/unpublish only toggles Asset Module visibility — sharing grants persist."
  - "The 'open elsewhere' indicator is rendered ONLY on the Equipment Home Page (dashboard tabs and dashboard cards). Workspace dashboard cards do NOT show it."
  - "Only one Dashboard Editor session may be active per Dashboard at a time across the whole app. Opening the editor acquires a cross-tab edit lock keyed by dashboardId; if another tab already holds the lock, the new tab is denied entry and a 'This dashboard is being edited at the moment' notification/toast is shown. The lock is released on editor unmount, save, or pagehide."
  - "Dashboard.thumbnailUrl is populated by capturing a generated screenshot of the rendered dashboard widget grid (e.g. via html2canvas-style mock or a deterministic SVG/canvas mock); thumbnails refresh on save. v1 may use a deterministic placeholder image generator if a real screenshot library is not yet wired."
